<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient)" />
  
  <!-- Sun rays -->
  <g stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="100" y1="20" x2="100" y2="40" />
    <line x1="100" y1="160" x2="100" y2="180" />
    <line x1="20" y1="100" x2="40" y2="100" />
    <line x1="160" y1="100" x2="180" y2="100" />
    <line x1="43" y1="43" x2="57" y2="57" />
    <line x1="143" y1="143" x2="157" y2="157" />
    <line x1="43" y1="157" x2="57" y2="143" />
    <line x1="143" y1="57" x2="157" y2="43" />
  </g>
  
  <!-- Sun center -->
  <circle cx="100" cy="100" r="35" fill="white" />
  
  <!-- Inner sun glow -->
  <circle cx="100" cy="100" r="25" fill="url(#innerGradient)" />
  
  <!-- Book/Scroll shape -->
  <path d="M85 95 Q100 85 115 95 L115 115 Q100 105 85 115 Z" fill="url(#bookGradient)" stroke="white" stroke-width="2"/>
  
  <!-- Cross on book -->
  <line x1="100" y1="90" x2="100" y2="110" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="100" x2="108" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
