<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#favGradient)" />
  
  <!-- Simplified sun rays -->
  <g stroke="white" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="3" x2="16" y2="6" />
    <line x1="16" y1="26" x2="16" y2="29" />
    <line x1="3" y1="16" x2="6" y2="16" />
    <line x1="26" y1="16" x2="29" y2="16" />
  </g>
  
  <!-- Sun center -->
  <circle cx="16" cy="16" r="6" fill="white" />
  
  <!-- Cross -->
  <line x1="16" y1="13" x2="16" y2="19" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="18" y2="16" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
